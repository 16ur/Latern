services:
  db:
    image: postgres:16
    container_name: latern_db
    environment:
      POSTGRES_DB: latern
      POSTGRES_USER: latern
      POSTGRES_PASSWORD: latern
    ports:
      - "5432:5432"
    volumes:
      - latern_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./latern-backend
    container_name: latern_backend
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./latern-backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DB_NAME: latern
      DJANGO_DB_USER: latern
      DJANGO_DB_PASSWORD: latern
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
    depends_on:
      - db

  frontend:
    build: ./latern-frontend
    container_name: latern_frontend
    command: bun run dev --hostname 0.0.0.0
    volumes:
      - ./latern-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:8000/api

volumes:
  latern_postgres_data:
